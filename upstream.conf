# Will Estes's release signing key (keys/flex-signing-key.asc, from keyserver.ubuntu.com).
UPSTREAM_GPG_KEY=56C67868E93390AA1039AD1CE4B29C8D64885307
# Our patch level on top of the upstream release (2.6.4-vms1)
VMS_PATCH_LEVEL=1
